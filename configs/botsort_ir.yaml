# BoT-SORT for dim-small IR targets (Phase 2). Based on Ultralytics botsort.yaml defaults.
tracker_type: botsort
track_high_thresh: 0.20  # plan: conf_thres 0.20
track_low_thresh: 0.05
new_track_thresh: 0.25
track_buffer: 60         # Paper 1: best for recovering temporarily lost targets
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow  # LK optical flow + RANSAC affine camera motion compensation
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False         # ReID on 5x5 px crops carries no appearance signal
model: auto
